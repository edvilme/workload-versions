parameters:
- name: publishToFeed
  displayName: Publish to feed
  type: boolean
  default: false
- name: feedForPublishing
  displayName: Feed for publishing
  type: string
  default: public/dotnet10-workloads

steps:
- script: |
    echo "publishToFeed: $(parameters.publishToFeed)"
    echo "feedForPublishing: $(parameters.feedForPublishing)"
    echo "Build.SourcesDirectory: $(Build.SourcesDirectory)"
  displayName: Print Parameters
  condition: eq(parameters.publishToFeed, true)
